services:
  - type: web
    name: petstore-api
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://petstore-web.onrender.com

  - type: web
    name: petstore-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-api.onrender.com

databases:
  - name: petstore-db
    plan: free
    databaseName: petstore
    user: petstore

services:
  - type: web
    name: petstore-api
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/petstore-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://petstore-web.onrender.com

  - type: static
    name: petstore-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-api.onrender.com

  - type: pserv
    name: petstore-db
    env: postgres
    plan: starter
    databaseName: petstore
    user: petstore
